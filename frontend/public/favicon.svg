<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#080e1a" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#1e293b" />
  
  <!-- Outer radar ring -->
  <circle cx="16" cy="16" r="10" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
  
  <!-- Eye contour (Camouflage breaking) -->
  <path d="M5 16 C8 10, 24 10, 27 16 C24 22, 8 22, 5 16 Z" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Motion Iris & Pupil -->
  <circle cx="16" cy="16" r="4.5" fill="#06b6d4" opacity="0.3" />
  <circle cx="16" cy="16" r="3" fill="#22d3ee" />
  <circle cx="17" cy="15" r="1" fill="#ffffff" />
  
  <!-- Motion ripple spark -->
  <path d="M21 9 L24 6" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M25 11 L28 10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
</svg>
